application:
  subdomain: openship
  entries:
    - id: dashboard
      title: Dashboard
      path: /
    - id: website
      title: Website
      path: /
      prefix_domain: www
  upstreams:
    - location: /
      backend: http://dashboard:3001/
      fix_websocket_header: true
    - location: /
      domain_prefix: www
      backend: http://web:3000/
  public_path:
    - /
  injects:
    - id: login-autofill
      on: browser
      when:
        - /login
      do:
        - src: builtin://simple-inject-password
          params:
            user: "{{ .U.login_email }}"
            password: "{{ .U.login_password }}"
services:
  postgres:
    # postgres:16-alpine (copied once; intentionally excluded from automatic updates)
    image: registry.lazycat.cloud/czyt/library/postgres:1213d14f3606e644
    environment:
      - POSTGRES_USER=openship
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_DB=openship
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U openship -d openship
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1G
  redis:
    # redis:7-alpine (copied once; intentionally excluded from automatic updates)
    image: registry.lazycat.cloud/czyt/library/redis:4e8bf856b57fe5d2
    command: redis-server --appendonly yes
    binds:
      - /lzcapp/var/redis:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512M
  api:
    # ghcr.io/dockers-x/openship-api:0.3.0
    # upstream: ghcr.io/dockers-x/openship-api:0.3.0
    image: registry.lazycat.cloud/czyt/dockers-x/openship-api:4428d4c655575cbf
    command: >-
      /bin/sh -c 'bun /lzcapp/pkg/content/openship/wait-for-dependencies.mjs && exec bun run apps/api/dist/index.js'
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLOUD_MODE=false
      - DEPLOY_MODE=docker
      - TRUST_PROXY=true
      - OPENSHIP_REQUIRE_AUTH=true
      - CLOUD_MAX_PROJECTS_PER_USER=2
      - POSTGRES_USER=openship
      - POSTGRES_PASSWORD={{ stable_secret "postgres_password" }}
      - POSTGRES_DB=openship
      - DATABASE_URL=postgresql://openship:{{ stable_secret "postgres_password" }}@postgres:5432/openship
      - REDIS_URL=redis://redis:6379
      - OPENSHIP_REQUIRE_REDIS=true
      - BETTER_AUTH_SECRET={{ stable_secret "better_auth_secret" }}
      - OPENSHIP_PUBLIC_URL=https://{{ .S.AppDomain }}
      - OPENSHIP_EXTRA_TRUSTED_ORIGINS=https://{{ .S.AppDomain }}
      - OPENSHIP_HOSTNAME={{ .S.AppDomain }}
      - OPENSHIP_DOMAIN_KIND=byo
      - INTERNAL_TOKEN={{ stable_secret "internal_token" }}
      - GITHUB_APP_SLUG=openship-io
      {{if .U.github_client_id}}- GITHUB_CLIENT_ID={{ .U.github_client_id }}{{end}}
      {{if .U.github_client_secret}}- GITHUB_CLIENT_SECRET={{ .U.github_client_secret }}{{end}}
      {{if .U.google_client_id}}- GOOGLE_CLIENT_ID={{ .U.google_client_id }}{{end}}
      {{if .U.google_client_secret}}- GOOGLE_CLIENT_SECRET={{ .U.google_client_secret }}{{end}}
      {{if .U.smtp_host}}- SMTP_HOST={{ .U.smtp_host }}{{end}}
      {{if .U.smtp_host}}- SMTP_PORT={{ .U.smtp_port }}{{end}}
      {{if .U.smtp_user}}- SMTP_USER={{ .U.smtp_user }}{{end}}
      {{if .U.smtp_pass}}- SMTP_PASS={{ .U.smtp_pass }}{{end}}
      {{if .U.smtp_from}}- SMTP_FROM={{ .U.smtp_from }}{{end}}
      - SYSTEM_DEBUG_LOGS=false
    depends_on:
      - postgres
      - redis
    healthcheck:
      test:
        - CMD-SHELL
        - bun -e "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 2G
  dashboard:
    # ghcr.io/dockers-x/openship-dashboard:0.3.0
    # upstream: ghcr.io/dockers-x/openship-dashboard:0.3.0
    image: registry.lazycat.cloud/czyt/dockers-x/openship-dashboard:f1a3d94127da76b1
    command: >-
      /bin/sh -c 'node -e "(async()=>{const url=\"http://api:4000/api/system/bootstrap-admin\";const body={name:process.env.OPENSHIP_ADMIN_NAME,email:process.env.OPENSHIP_ADMIN_EMAIL,password:process.env.OPENSHIP_ADMIN_PASSWORD};const headers={\"content-type\":\"application/json\",\"x-internal-token\":process.env.INTERNAL_TOKEN};let last=\"API unavailable\";for(let i=0;i<60;i++){try{const r=await fetch(url,{method:\"POST\",headers,body:JSON.stringify(body)});if(r.ok||r.status===409)process.exit(0);last=\"HTTP \"+r.status}catch(e){last=e.message}await new Promise(resolve=>setTimeout(resolve,2000))}console.error(\"Administrator bootstrap failed: \"+last)})()" & exec node apps/dashboard/server.js'
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_API_URL=http://api:4000
      - OPENSHIP_PUBLIC_URL=https://{{ .S.AppDomain }}
      - INTERNAL_TOKEN={{ stable_secret "internal_token" }}
      - OPENSHIP_ADMIN_NAME={{ .U.admin_name }}
      - OPENSHIP_ADMIN_EMAIL={{ .U.login_email }}
      - OPENSHIP_ADMIN_PASSWORD={{ .U.login_password }}
    depends_on:
      - api
    mem_limit: 1G
  web:
    # ghcr.io/dockers-x/openship:0.3.0
    # upstream: ghcr.io/dockers-x/openship:0.3.0
    image: registry.lazycat.cloud/czyt/dockers-x/openship:81629d75e5e13727
    environment:
      - NODE_ENV=production
      - PORT=3000
    mem_limit: 512M
usage: |
  默认入口打开 Openship Dashboard；“项目主页”入口打开上游 Web 页面。
  首次启动会使用部署参数自动创建管理员，登录页面会自动填充账号密码。
  应用以自托管模式运行，PostgreSQL 与 Redis 数据保存在应用私有目录中。
